<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>VVF 1.6mm / 2.0mm 判定ツール</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 20px auto; line-height: 1.6; }
    label { display: block; margin-top: 10px; }
    input, select, button { padding: 6px; margin-top: 4px; }
    .result { margin-top: 20px; padding: 10px; border-radius: 4px; }
    .ok { background: #e0f7e9; border: 1px solid #4caf50; }
    .ng { background: #ffe4e4; border: 1px solid #f44336; }
  </style>
</head>
<body>

  <h1>VVF 1.6mm / 2.0mm 自動判定</h1>
  <p>室内機の銘板を見て、次の項目を入力してください。</p>

  <label>
    電源電圧（銘板の「電源」などに記載）
    <select id="voltage">
      <option value="100">100V</option>
      <option value="200">200V</option>
    </select>
  </label>

  <label>
    運転電流 A（銘板の「運転電流」「電流」など）
    <input type="number" id="current" step="0.1" placeholder="例：7.5">
  </label>

  <label>
    配線長さ（片道）m（室内機〜分電盤までのおおよその距離）
    <input type="number" id="length" step="0.1" placeholder="例：15">
  </label>

  <label>
    許容電圧降下（％）
    <input type="number" id="vdropPercent" step="0.1" value="2">
  </label>

  <button onclick="calcCable()">判定する</button>

  <div id="result" class="result" style="display:none;"></div>

  <script>
    // 定数（代表値）
    const I_MAX_16 = 18;      // VVF 1.6mm² 許容電流 [A]
    const I_MAX_20 = 23;      // VVF 2.0mm² 許容電流 [A]
    const R_16 = 0.011;       // 1.6mm² 抵抗値 [Ω/m]（片道）
    const R_20 = 0.0087;      // 2.0mm² 抵抗値 [Ω/m]（片道）

    function calcVoltageDrop(I, R, L) {
      // ΔV = I × (2 × r × L)  往復分で2倍
      return I * (2 * R * L);
    }

    function calcCable() {
      const V = Number(document.getElementById('voltage').value);
      const I = Number(document.getElementById('current').value);
      const L = Number(document.getElementById('length').value);
      const vdropPercent = Number(document.getElementById('vdropPercent').value);

      const resultDiv = document.getElementById('result');

      if (!V || !I || !L || !vdropPercent) {
        resultDiv.style.display = 'block';
        resultDiv.className = 'result ng';
        resultDiv.textContent = 'すべての項目を入力してください。';
        return;
      }

      const vdropAllow = V * (vdropPercent / 100); // 許容電圧降下 [V]

      // 1.6mm² のチェック
      const vdrop16 = calcVoltageDrop(I, R_16, L);
      const okCurrent16 = I <= I_MAX_16;
      const okVdrop16 = vdrop16 <= vdropAllow;

      // 2.0mm² のチェック
      const vdrop20 = calcVoltageDrop(I, R_20, L);
      const okCurrent20 = I <= I_MAX_20;
      const okVdrop20 = vdrop20 <= vdropAllow;

      let message = '';

      if (okCurrent16 && okVdrop16) {
        resultDiv.className = 'result ok';
        message += '【判定結果】VVF 1.6mm² でOKです。\n\n';
      } else if (okCurrent20 && okVdrop20) {
        resultDiv.className = 'result ok';
        message += '【判定結果】VVF 2.0mm² を推奨します。\n\n';
      } else {
        resultDiv.className = 'result ng';
        message += '【判定結果】VVF 2.0mm²でも厳しい可能性があります。\n';
        message += 'CVケーブルやさらに太い線の検討が必要です。\n\n';
      }

      message += '--- 詳細 ---\n';
      message += `入力電圧：${V} V\n`;
      message += `運転電流：${I.toFixed(2)} A\n`;
      message += `配線長さ（片道）：${L.toFixed(1)} m\n`;
      message += `許容電圧降下：${vdropAllow.toFixed(2)} V（${vdropPercent}%）\n\n`;

      message += `[VVF 1.6mm²]\n`;
      message += `・許容電流：${I_MAX_16} A（判定：${okCurrent16 ? 'OK' : 'NG'}）\n`;
      message += `・電圧降下：${vdrop16.toFixed(2)} V（判定：${okVdrop16 ? 'OK' : 'NG'}）\n\n`;

      message += `[VVF 2.0mm²]\n`;
      message += `・許容電流：${I_MAX_20} A（判定：${okCurrent20 ? 'OK' : 'NG'}）\n`;
      message += `・電圧降下：${vdrop20.toFixed(2)} V（判定：${okVdrop20 ? 'OK' : 'NG'}）\n`;

      resultDiv.style.display = 'block';
      resultDiv.textContent = message;
    }
  </script>

</body>
</html>
